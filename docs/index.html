<style>
  :root {

    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);

    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;

  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

o see what it takes to load, protect, and install the cables that keep the world connected.", "transcript": "We went aboard one of Subcom's cable laying ships. They're very expensive, they're very specialized. Once you spend anywhere upwards of $200 plus million to buy one, then the spending starts after that. Subcom had to cut back its fleet to survive the cable oversupply in 2001. The industry went from very robust to no projects for three years. Now the company has just eight cable laying ships to keep up with demand. And loading and installing one line can take months. They have to feed the cable straight from the factory to the ship because using trucks or rail would take too long. Repeaters arrive attached to the cable. Just one of these weighs 800 pounds, and dropping it could cost the company millions of dollars. We have people spread out all over so that we do not drag the cable on deck, which might cause any damage or gouges. Once the workers finished loading the repeater onto the ship, we headed downstairs into the cable tank. The ship is eight stories tall, so it has enough room to store thousands of miles of cable. The only way to enter the tank is by climbing down this ladder. Workers do 12-hour shifts to make sure the cable is perfectly stacked. The process is called flaking. No gaps in between. It might hold cable from the flake under, and it will cause, like, a cable damage. They run the operation nonstop until it is fully loaded, which can take up to a month. After months of manufacturing, testing, and loading, Captain Imad Ibali and his crew head out to sea for two months to lay the cable. He even charts the route on paper, and rarecases their GPS malfunctions. They plan every route to avoid earthquake zones and busy shipping lanes. And in near shore areas, they use machines like this one to bury it to help protect it from anchors and fishing gear. We have a port and a starboard camera. That gives us a 3D visual image on what we're looking at. The machine uses high-pressure water jets to break up the sand and bury the cable. And once the boat reaches deep water, beyond threat from anchors, they stop burying the line and lay it on top of the sand.", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 33608, "comments": 216, "er": 0.67, "followers": 5057570, "date": "2026-10-24", "url": "https://www.instagram.com/p/De4FV9eDadU/", "video": true, "ratio": 0, "score": 0.68, "status": "未处理", "x": 6.8}, {"id": "DePiGbqCKid", "tracker": "viral-radar 竞对", "competitor": "gymshark", "caption": "Adapt Solid is here\nThe drop you waited for @whitneyysimmons has done it again 🤏\n🔗 in bio to shop", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 53749, "comments": 348, "er": 0.62, "followers": 8725732, "date": "2026-10-08", "url": "https://www.instagram.com/p/DePiGbqCKid/", "video": false, "ratio": 0, "score": 0.63, "status": "未处理", "x": 0.9}, {"id": "DfAPqVlGrTc", "tracker": "viral-radar 竞对", "competitor": "apple", "caption": "Tech at play.\n#ShotoniPhone by…\n\n1. Nikias M. @nikiasmolina\n2. Federica C. @fedecobe\n3. Maxime L. @f1ub\n4,6. Marina H. @pro_perleprinter\n5. Leonardo M. & Omar A. @martinessleonardo @omaramorxo\n7,8. Eleonore B. @vitamin___color", "transcript": "", "brk": "", "my": "", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 232205, "comments": 1010, "er": 0.61, "followers": 38160214, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAPqVlGrTc/", "video": false, "ratio": 0, "score": 0.62, "status": "未处理", "x": 0.8}, {"id": "Ddx10DaCHgl", "tracker": "viral-radar 竞对", "competitor": "gymshark", "caption": "Inevitable.\nRyan Terry. 4x Men’s Physique champion.\n📸: @michael.deckena", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 52183, "comments": 289, "er": 0.6, "followers": 8725732, "date": "2026-09-27", "url": "https://www.instagram.com/p/Ddx10DaCHgl/", "video s": 29602, "comments": 632, "er": 0.36, "followers": 8426621, "date": "2026-10-06", "url": "https://www.instagram.com/p/DeKx6uXRG3X/", "video": true, "ratio": 0, "score": 0.37, "status": "未处理", "x": 1.2}, {"id": "DdcMv_BnaNA", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "The three keys to making the impossible possible:\n\n1. Set a goal that scares you\n2. Make it a must, not a should\n3. Give it a tight deadline\n\nWhat’s the moonshot you’ve been putting off?\n\nI talk about moonshot goals and more this week’s edition of The Edge, my free weekly newsletter with the strategies, breakthroughs, and tools to create an extraordinary life. 📨\n\n👉 Leave a comment below (or the link in bio) and I’ll send you the link to register so you don’t miss the next one.", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 28543, "comments": 978, "er": 0.35, "followers": 8426621, "date": "2026-09-18", "url": "https://www.instagram.com/p/DdcMv_BnaNA/", "video": false, "ratio": 0, "score": 0.37, "status": "未处理", "x": 1.2}, {"id": "Ddmph-ZxkBM", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "Happiness isn’t waiting on the right conditions. It’s waiting on your permission.\n\nMuch love and Bula from Fiji. 🇫🇯❤️🤟", "transcript": "Hello everybody from Fiji, Bula. This is one of my favorite places on Earth. It's off of my little deck here. First time I came here, I was off of this far little island and I met this Fijian man and he was saying, I think Fiji people are the happiest people on Earth. And then he paused for a moment and he goes, of course I've never been anywhere else. Ha ha ha. You know? And I said, well why do you think you guys are so happy? And he said, well look, look at the sunshine. The sun is so amazing. It gives so many gifts. I said, well okay, now I get it. It's because it's so sunny here all the time. He goes, oh, but also the rain. You love it when it rains. It's so wonderful when it rains. You know, the real secret to happiness is having rules that make it easy to be happy. You know, many of us make it so hard or we think happiness is not something important. In our culture, we make everything else more important than happiness. But happy people live longer, happy people have better relationships, happy people tend to do better in their life and in business. You know, how much happiness are you willing to allow yourself to have? And could you get rid of some of the rules that say everything has to be a certain way for you to be happy taking just a few moments of something beautiful. Whether it be with your kids or with your husband or your wife or your friends or your work or your mission, like finding the little things and being happy by them, letting everything make you happy. I also interviewed a woman years ago who was the oldest living, at that time, person who survived the Auschwitz camps. And she was an amazing lady. Maybe I'll post her video again. But one of the things I noticed is, you know, she was forced as one of the great pianists of the time to play music for the Nazis. And the whole idea was, if she didn't do a good job, that they'd kill her child right in front of her. And when they were making films, trying to convince Europe that the Nazis were not killing Jews at the time. And she literally, she would play this music and she said, music saved her life. And she was 104 years old when I was interviewing her, living alone, swimming every day and playing music. And music was her form of happiness. Her son lived to be 80 and then she outlived him. And yet she had no pain, no doubt. She said, everything was beautiful. She thought the microphone was beautiful. I was beautiful. My wife was beautiful. She doesn't resent anything. She just said, everything in life has a gift and it's our job to find it. So perhaps it's time to find some gifts to notice not only what's wonderful, but notice what's beautiful in your life and taking some joy from it. All right, that's my two cents for right now. I don't know if that triggers you of any value, but I'm feeling damn good out here in this beautiful place with these beautiful people. Blessings to you and your family.", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 25681, "comments": 1149, "er": 0.32, "followers": 8426621, "date": "2026-09-22", "url": "https://www.instagram.com/p/Ddmph-ZxkBM/", "video": true, "ratio": 0, "score": 0.35, "status": "未处理", "x": 1.2}, {"id": "DdMXfEGlGaX", "tracker": "viral-radar 竞对", "competitor": "apple", "caption": "Stop time in its tracks. \nCommissioned by Apple. Capture the moment the way you see it with variable aperture and the versatility of Pro controls on iPhone 18 Pro. #ShotoniPhone by…\n\n1. Nicholas Alan C. @nicholasalancope\n2,4,5. Silvana T. @silvanatrevale\n3. Luis Alberto R. @luisalbertorodriguezstudio", "transcript": "", "brk": "", "my": "", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 127139, "comments": 789, "er": 0.34, "followers": 38160214, "date": "2026-09-12", "url": "https://www.instagram.com/p/DdMXfEGlGaX/", "video": false, "ratio": 0, "score": 0.34, "status": "未处理", "x": 0.4}, {"id": "DfBULvfmFof", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "One viral review changed the trajectory of Natendrea Jones's business.\n \nJones had been selling seafood platters from her South Carolina home kitchen when TikTok food reviewer Gabriel Rivera came across her listing and offered her $200 to make him whatever she wanted. After he shared her creation online, her business caught the attention of far more people than she expected.\n\nCorrespondent Kathleen Elkins reports on how Jones adapted her business, Red's Garlic Seafood @geechee_goddess, to handle the demand.\n\nFind out how one seafood platter became viral at the link in our bio.\n\n#smallbusiness #entrepreneurship #seafood #tiktok", "transcript": "How did a South Carolina caterer turn a Facebook marketplace listing into 300 overnight orders? I made $5,000 in two days. $5,000? Wow. For years, Natendria Jones used Facebook Marketplace to sell seafood platters from her home kitchen. It was a side hustle. Thank you. Until TikTok food reviewer Gabriel Rivera found one of the listings. Holy s***. He offered her $200 to make him whatever she wanted. This has to be the craziest thing I've gotten off of Facebook so far. Jones made him a pan overflung with snow crab legs, lobster, shrimp, oysters, and fixings. When Rivera posted his review, the video went viral and the response was immediate. Save my life. You saved my family, my children. I've been crying. Oh my goodness. You changed my life. I'm so happy to leave. I'm sorry. I was a fool. No, it's okay. No, it's okay. I got people from Virginia, North Carolina, Maryland coming through. Jones said it helped create 300 orders overnight and generate $50,000 in sales in the following two weeks. But the sudden interest from hundreds of customers created a new problem. Keeping up. Jones recruited family members to help and had to refund some orders she didn't have the resources to fulfill. I love these problems, Joe. I had to stop and run out and go get some more lobsters. I ran out of lobsters. She has since built more structure into the business, using pre-orders to plan inventory and scheduling pickup windows. You're going to hear from me. Okay, there's a list. Her home kitchen operation can now handle 50 to 60 orders on busy days. Next, she hopes to open a food truck with the long-term dream of running a brick and mortar restaurant. Going viral got customers' attention, but adapting her operations to meet the demand is what made this small business work. Read more small business stories like this and subscribe to the Small Business Newsletter at Business Insider.", "brk": "", "my": "", "tags": "smallbusiness, entrepreneurship, seafood, tiktok", "bait": false, "type": "Video", "likes": 16881, "comments": 152, "er": 0.34, "followers": 5057570, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfBULvfmFof/", "video": true, "ratio": 0, "score": 0.34, "status": "未处理", "x": 3.4}, {"id": "DfAPK04DZMW", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "Subsea cables carry data thousands of miles across oceans, but the glass fibers inside of them are extremely fragile.\n\nAt SubCom's factory in New Hampshire, workers protect the fibers with steel and copper layers, then test the cable before it heads to the ocean floor.", "transcript": "At Subcom's New Hampshire factory, machines run around the clock, unwinding thousands of miles of glass. These fibers are the core of every subsea cable. But they're extremely fragile. If they bend too much, they can snap. And the slightest scratch can massively reduce the ability for light pulses to travel down it. So quality is really important in the manufacturing process. Because once this is installed in the ocean, the expectation is this is going to run for years and we don't want to have to go out there and do any kind of repairs on it. So workers wear protective gear to keep hair or dirt from touching the fibers. This machine wraps high tensile steel wire around the cable to help protect it from damage. It's the same type of material used to suspend structures like the Golden Gate Bridge. After the steel, another layer, copper. It has to be perfectly seam welded for the entire length. The ceiling keeps water out. If there's ever a clog, even a pinhole in the copper, we have to do a repair on that immediately. This copper casing will move electricity down the cable to a device called a repeater. It's based about every 55 miles of cable. The device amplifies light pulses as they travel thousands of miles across the sea floor. Once they finish a cable, they test every inch of it inside this room, where there are over 100 pans full of finished cable weighing about 70 tons each. Once they move each tank, workers have to climb up and attach it to a crane. They submerge the cable in water and pass electricity through it to make sure there are no faults. The cable is designed to last at least 25 years. We got to make sure that once we install this, that it's going to operate for the lifetime of the network.", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 16369, "comments": 86, "er": 0.33, "followers": 5057570, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAPK04DZMW/", "video": true, "ratio": 0, "score": 0.33, "status": "未处理", "x": 3.3}, {"id": "De2cVtcChlh", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "Whatever we think life is, that’s what life becomes.", "transcript": "Life is controlled by your beliefs. It's not controlled by the reality because you respond to your perception of reality. Once we decide how life is, we color it to match what we think. We shade it. If we think life is shitty, we put a shitty shade. And if everything life's beautiful, we put a beautiful shade. Whatever you think life is, that's what life becomes. Is life a test? Is it a battle? Is it a war? Is it a gift? Is it sacred? Is it a dance? What if life's a party? Then what's life like? Woo! Notice that it has a different energy, doesn't it? So which one is life? No, it's not all of them. It's whichever one you decide it, because once you decide it, you will color life and you will find what makes you believe that's still true. You will find beige and make it brown to match whatever you think it is. If you think people are mean, you're gonna find meanness. You think they're good, good. If you think you're good, you're gonna find the good. If you think you're terrible, you're gonna find terrible in you. That's how powerful these beliefs are.", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 24229, "comments": 457, "er": 0.29, "followers": 8426621, "date": "2026-10-23", "url": "https://www.instagram.com/p/De2cVtcChlh/", "video": true, "ratio": 0, "score": 0.3, "status": "未处理", "x": 1.0}, {"id": "Deu0NJMxC7H", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "The brain is millions of years old, designed to keep us alive, not to make us happy.\n\nHappiness is our job. ❤️", "transcript": "It's the thoughts that are stressful that you believe that mess you up. When you question them, you break the pattern. I bought into the theory that this survival software that's constantly running and making you suffer, that that's normal. No, that's what the mind will do. What I'm gonna do is something different. And the way I get out of suffering, I give myself a 90 second rule. It's really simple. I say, look, if I feel myself starting to feel that stress, feeling that pissed offness or upsetness or concern or worry about my kid, whatever, I realize that's not gonna make it better. Life's too short to suffer. And then I just kind of breathe slowly, slow everything down. And I just watch the thought go by, oh, look at that crazy thought. It's the thoughts that are stressful that you believe that mess you up. When you question them, you break the pattern. By the way, Richard, to be honest, in the beginning it should have been like four hour rule. Maybe a four day rule. I was not very good. A waiting period. Yes, but what's nice is the more I've done, it's like a muscle. The more I've trained myself to do it, I can authentically tell you now, it takes a lot for something to take more than 90 seconds for me now. And the level of joy surpasses all the money you could ever have in a million years. And then the money, it's easier to even make money because you're not attached. You don't have the fears. You don't have the scarcity that people have because you feel so rich already right now. I always tell people, don't wait to be rich. What is that richness? It's abundance, it's joy, it's happiness, it's contribution, it's getting out of yourself.", "brk": "  west,” says Bünyamin Aydin. \n\nFor @lesbenjamins 15-year anniversary, the Turkish designer invited his community to Cappadocia’s Rose Valley to showcase his ‘From Earth to Sky’ collection up close – with a fashion show set against a vibrant backdrop of abstract hot air balloons. And no, they’re not AI.\n\n#ShotoniPhone18Pro", "transcript": "", "brk": "", "my": "", "tags": "ShotoniPhone18Pro", "bait": false, "type": "Carousel", "likes": 93808, "comments": 1334, "er": 0.25, "followers": 38160214, "date": "2026-10-14", "url": "https://www.instagram.com/p/DefL3KcEmVL/", "video": false, "ratio": 0, "score": 0.26, "status": "未处理", "x": 0.3}, {"id": "De94HiYDaLW", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "From intern to CEO. \n\n@pwcus CEO Paul Griggs has spent about 30 years building his career at the company. He shared one habit that has helped shape his approach to getting ahead at work. Senior reporter @ana.altchek explores his advice and how it could help you navigate your own career.\n\n#careers #leadership #careeradvice", "transcript": "If you want to get better at climbing the corporate ladder, here's one habit that the CEO of PWC used to go from intern to the C-suite. Paul Griggs has been at PWC for roughly 30 years, and now he leads its U.S. business. His career advice hasn't changed much from the time he started. He says that you should stay curious, even when you're not being prompted. Early in his career, Griggs worked with a partner who had a habit that he still remembers. In every meeting, he would bring a notebook with him, and on one side he would write down notes, and the other side he would write down questions. Anything he didn't understand would go on that second side so he could learn about it later. Griggs says that that kind of curiosity gives workers an edge. Say two people encounter the same problem at work. One of them waits to be told what they need to know, and the other person goes and does a little bit of research on their own. When the next conversation comes around, that person that did more research is a little bit quicker, they're able to contribute more, and that's where the compounding starts. Over time, that person starts to get more responsibility, and then they get more opportunities to move up quicker. So here's today's challenge. The next time you have a meeting to go to, or a deck of slides to review, bring a notebook with you and write down all of the questions that you don't have an answer to. Then choose one of those and spend just 20 minutes researching it before you go into work the next day. Because getting ahead at work isn't just about doing what's asked of you, it's about being curious enough to learn what no one asked you to. For more tips on how to get better at work, head to Business Insider.", "brk": "", "my": "", "tags": "careers, leadership, careeradvice", "bait": false, "type": "Video", "likes": 12380, "comments": 107, "er": 0.25, "followers": 5057570, "date": "2026-10-26", "url": "https://www.instagram.com/p/De94HiYDaLW/", "video": true, "ratio": 0, "score": 0.25, "status": "未处理", "x": 2.5}, {"id": "Dd60TciEcII", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "Happiness is found in the absence of expectation and a continuous focus on appreciation. ❤️", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 20559, "comments": 204, "er": 0.25, "followers": 8426621, "date": "2026-09-30", "url": "https://www.instagram.com/p/Dd60TciEcII/", "video": false, "ratio": 0, "score": 0.25, "status": "未处理", "x": 0.8}, {"id": "DdSFuTny31Q", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "Where focus goes, energy flows. Stop counting what’s missing and start noticing — and feeling gratitude — for what you already have. \n\nTry that shift this week and watch what changes. 🙏❤️😎", "transcript": "If you're always focusing on what's missing, how will you ever sustain happiness? W ge.", "brk": "", "my": "", "tags": "", "bait": false, "type": "Video", "likes": 16569, "comments": 372, "er": 0.2, "followers": 8426621, "date": "2026-10-02", "url": "https://www.instagram.com/p/DeAdLtMCVkf/", "video": true, "ratio": 0, "score": 0.21, "status": "未处理", "x": 0.7}, {"id": "Dc31bhWsyZQ", "tracker": "viral-radar 竞对", "competitor": "tonyrobbins", "caption": "EVERYTHING is a gift when we make the choice to live in a beautiful state of being. ❤️🙏\n\n#TonyRobbinsUPW", "transcript": "It's our job to find the way to perceive life where we see the gift instead of seeing the problem. If you don't look for it, you're not gonna find it. If you've ever been in pain, and then five, 10 years later, you're no longer in pain, it's because you changed the meaning. You went, okay, I don't like that happen, but man, it made me so much stronger. Man, it made me care so much more. Man, I mean, I really see the wisdom of this. So if you could operate that I'm not, life is not happening to me, it's always happening for me, but it's my job to find it, then you'll live in a beautiful state. But you have to make a decision to live this way because your old conditioning is the opposite. Cause the brain of everyone in this room has been trained for survival. And our job really is to decide, I'm gonna live in a beautiful state, not a being a beautiful state. You gotta look for the beauty. You gotta look for the good. You gotta be conscious about it, cause your subconscious mind is a survival mechanism, and it's always looking for what could go wrong and how to protect you. So you're gonna survive, but if you wanna be happy, that's your job.", "brk": "", "my": "", "tags": "TonyRobbinsUPW", "bait": false, "type": "Video", "likes": 14821, "comments": 253, "er": 0.18, "followers": 8426621, "date": "2026-09-04", "url": "https://www.instagram.com/p/Dc31bhWsyZQ/", "video": true, "ratio": 0, "score": 0.18, "status": "未处理", "x": 0.6}, {"id": "DfC7bdjgaRP", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "A single severed undersea internet cable can take weeks and more than $1 million to repair.\n\nCrews use remotely operated vehicles and grappling hooks to retrieve damaged cables from the seafloor, then reconnect their glass fibers within microns. Many of these cuts are accidental — but not all are.\n\nHead to the link in our bio to learn why protecting undersea cables is becoming a major security concern as the world relies more on cloud computing and AI.\n\n#ocean #internet #underseacable #security #internetcable #securityrisk #bigbusiness", "transcript": "And cuts do happen. In fact, roughly 100 cables are severed accidentally every year, often by ship anchors. To repair them, the crew uses a remotely operated vehicle to find the cable. Then a grappling hook to pull it from the seafloor. On board, they reconnect the glass fibers with a machine called a fusion spicer. We remove all watches and jewelry when we're splicing to reduce the risk of breaking any fibers. The machine uses cameras to line up the two ends of fiber within microns, millions of a meter. Then it melts them together. Repairs can take weeks and cost more than a million dollars. In worse cases, a break can cut an entire country off from the internet. Like in 2022, when a volcanic eruption severed the cable connecting Tonga with the outside world. It took 18 months to restore the internet back to normal. But not all cuts are accidental. From the Baltic Sea to the Taiwan Strait, cable disruptions are raising fears that covert warfare is moving underwater. We saw another incident in the Baltic Sea, with disruption So far no recent investigation has proved that a foreign government ordered the sabotage of an undersea cable. But as the world becomes more dependent on cloud computing and AI, the cost of losing connection is rising. We now need to be thinking about the seabed and what lies there. Ensuring their security and resilience is not only a technical issue, but also a matter of national and international security. To help protect undersea cables, countries have ramped up their naval patrols. Near the Baltic Sea, Finland is testing out a detection system using a technology called DAS interrogators. These devices attach to the cable and turn it into a giant vibration sensor, capable of recognizing nearby activity. But one of the best defenses against cable cuts is simply having more cables.", "brk": "", "my": "", "tags": "ocean, internet, underseacable, security, internetcable, securityrisk, bigbusiness", "bait": false, "type": "Video", "likes": 8374, "comments": 35, "er": 0.17, "followers": 5057570, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfC7bdjgaRP/", "video": true, "ratio": 0, "score": 0.17, "status": "未处理", "x": 1.7}, {"id": "DfDZuQ0Fx8x", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "Passengers on a live-aboard round-the-world cruise say they were abruptly asked to leave the ship and given only hours to disembark.\n\nVilla Vie Residences, which operates the residential cruise ship Villa Vie Odyssey, said on Tuesday it had halted operations due to surging fuel costs.\n\nThe ship was docked at the port of Sihanoukville in Cambodia when the announcement was made, with passengers saying they were given only eight hours to disembark.\n\nA notice on the Villa Vie Residences website says the company is working with residents to arrange temporary living arrangements and that it is evaluating restructuring options over the next 60 days.\n\nRead more about how residents scrambled to leave their cabins at the link in our bio.\n\nStory by Joshua Nelken-Zitser, Amanda Goh, and Will Martin\n\n(Credit: Getty Images)", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Carousel", "likes": 7413, "comments": 174, "er": 0.15, "followers": 5057570, "date": "2026-10-28", "url": "https://www.instagram.com/p/DfDZuQ0Fx8x/", "video": false, "ratio": 0, "score": 0.16, "status": "未处理", "x": 1.6}, {"id": "De43t9yDtxn", "tracker": "viral-radar 竞对", "competitor": "entrepreneur", "caption": "Jack Weis has a Ph.D. in chemical engineering from Ivy League powerhouse Princeton. His research on ice formation was cited by the Nobel committee.\n\nNow he can’t even get a food-prep job with a company that sells frozen crab cakes. \n\nSince graduating in 2024, Weis has applied to more than 2,300 jobs and still hasn’t landed one, according to The Wall Street Journal.\n\nHe started with pharmaceutical science roles and national lab fellowships. When that didn’t work out, he widened his search to software engineering and eventually frozen crab prep.\n\nTwo years after finishing his doctorate, Jack Weis is living in his parents’ basement. “It’s quite surprising,” said his mom. “I don’t know how to put it together.”\n\nHis story reflects a frozen job market for college graduates. Economists call it a “low-hire, low-fire” environment, where workers stay put and openings stay scarce.\n\nLong-term unemployment this summer hit its highest level in over a decade outside the pandemic, and AI screening too", "transcript": "", "brk": "", "my": "", "tags": "", "bait": false, "type": "Image", "likes": 4374, "comments": 485, "er": 0.1, "followers": 4643694, "date": "2026-10-24", "url": "https://www.instagram.com/p/De43t9yDtxn/", "video": false, "ratio": 0, "score": 0.13, "status": "未处理", "x": 4.3}, {"id": "DfAc_SbjRQt", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "Anthropic's potential IPO could make some of its founders and investors incredibly rich.\n\nThe company's newly released filing reveals who owns a piece of the AI company behind Claude. One cofounder's stake could be worth around $24 billion at a $1.5 trillion valuation, and major corporate investors could also be in line for huge returns. But who's positioned to benefit the most? Chief correspondent Ben Bergman breaks down the details.\n\nRead more about who's poised to cash in on Anthropic's IPO at the link in our bio.\n\n#Anthropic #AI #stockmarket #IPO #tech #investing", "transcript": "Who stands to win big from Anthropics IPO? The company is preparing for a listing next month and it's about to make some people very very rich. But the biggest winners aren't necessarily who you'd expect. The company behind Claude could be valued at more than $1.5 trillion in a few weeks and its newly released IPO reveals who owns a piece of the company. So let's start with the founders. Anthropics has 7 of them and each one owns hundreds of millions of shares. Tom Brown, Anthropics chief compute officer, owns roughly 244 million shares. At a $1.5 trillion valuation, his stake alone could be worth around $24 billion. And the founders aren't the only ones in line for a huge payday. Google and Amazon are each expected to own more than 5% of Anthropics. That could make each more than $75 billion. Then there's Spark Capital. Spark in 2023, the VC firm led a round that valued Anthropics at just $4.5 billion. At the time, some investors thought that price was way too high, but Spark went in anyway and kept investing. According to the filing, Spark has now invested $777 million in Anthropics across six funding rounds. Spark is the only VC firm named in the filing. It appears more than 50 times, that's because its partner sits on the board. Of course, Anthropics hasn't disclosed its expected IPO share price yet, so the exact values of these stakes is still unknown, but they're going to be a lot. For more on who's poised to cash in on Anthropics' historic IPO, head to Business Insider.", "brk": "", "my": "", "tags": "Anthropic, AI, stockmarket, IPO, tech, investing", "bait": false, "type": "Video", "likes": 5183, "comments": 42, "er": 0.1, "followers": 5057570, "date": "2026-10-27", "url": "https://www.instagram.com/p/DfAc_SbjRQt/", "video": true, "ratio": 0, "score": 0.1, "status": "未处理", "x": 1.0}, {"id": "DfKiXlaDZeU", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "A $300,000 flying car is in development. But are we ready for a future where cars take to the skies?\n\nBusiness Insider reporter Lloyd Lee looks at Alef Aeronautics' Model Zero Ultralight, how it compares with Tesla's latest Roadster demo, and the challenges that remain before flying cars become part of everyday life.\n\n#flyingcar #tesla #tech #transportation #innovation", "transcript": "", "brk": "", "my": "", "tags": "flyingcar, tesla, tech, transportation, innovation", "bait": false, "type": "Video", "likes": 4032, "comments": 109, "er": 0.08, "followers": 5057570, "date": "2026-10-31", "url": "https://www.instagram.com/p/DfKiXlaDZeU/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 0.9}, {"id": "De-a2QECu5d", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "Japan's conveyor-belt sushi restaurants have changed how they serve food after viral videos raised hygiene concerns. \n\nThe world's largest conveyor belt sushi restaurant is opening its first US location, but the experience may not be what American diners expect. Chief correspondent Abby Narishkin visited restaurants in Japan to see how the new ordering systems work and what questions remain about bringing the concept to the US.\n\n#sushi #Japan #foodculture #restaurants", "transcript": "Sushi-do, the world's largest conveyor belt sushi restaurant, is opening its first location in the U.S. this month. But it's not gonna look like this, with random sushi passing by up for grabs. That's because of these 2023 viral social media videos, showing people licking soy sauce bottles and touching saliva to sushi pieces as they rolled by. In response, the largest conveyor belt sushi chains in Japan changed how they served food. I'm in Japan on a three-week reporting trip, and I want to see this change for myself. Curious if it'll work in the U.S. So I biked the Sushi-do in Edo Gawa City, and as expected, there was no communal sushi carousel here. Before I could even sit down, I got a weightless number. And this place was packed on a Tuesday at lunch. Ten minutes later, I got my seat assignment and found my chair at the counter, complete with my own touchscreen for ordering. I was happy to see there still is some semblance of a conveyor belt, but it only sends food that you've already ordered right to your table. So you can't touch anyone else's food. I actually really like that one, chewy the rice and the bread shimble. I will say the screen took away some of the adventure of not knowing what you were eating. But I did get to see other people's dishes flying by, so I got a pang of jealousy or a tinge of curiosity that pushed me to copy their orders, which may have been the point of conveyor belt sushi to begin with, right? To eat with your eyes? Now let me try this booty. A little sushi. And it's not just sushi-do that implemented the change. This Choshimaru location I went to got rid of their conveyor belt completely at their counter seats. The chef just handed me my sashimi. The chainsay this new way is more sanitary and helps keep their fish fresher. On the previous carousel system, tuna for example would be polled and thrown away if it traveled more than 350 meters without being picked up. I was happy with the quality of sushi-do, especially considering the price. That's one thing I'm unsure the company will be able to bring to the U.S. Grocery prices are just higher in New York City, where the first location is set to open. I wonder if they'll be able to find fish that's as good for this cheap. And then there's the waste. Americans eat a lot and throw away a lot too. Now the company says all of its plates have an icy chip beneath them, so it can track a billion dishes annually. To better understand how much food might be ordered. I'm curious to see if those metrics are going to change with a completely new customer base. Overall, I think Americans are going to gobble up this concept. If only for the flashing lights and the gimmick of pulling your sushi off what's left of a conveyor belt.", "brk": "", "my": "", "tags": "sushi, Japan, foodculture, restaurants", "bait": false, "type": "Video", "likes": 4410, "comments": 94, "er": 0.09, "followers": 5057570, "date": "2026-10-26", "url": "https://www.instagram.com/p/De-a2QECu5d/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 0.9}, {"id": "DfHyqqdFCzy", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "The shipbuilding industry is hiring. But if you want a job, you'll need to learn some highly specialized skills.\n\nAt Austal USA, new workers can spend four years in apprenticeship training before working on vessels like Coast Guard cutters. But blazing hot temperatures, hourly pay, and weather-related work stoppages make retention a major challenge for shipyards.\n\n#coastguard #shipbuilders #america #madeinamerica", "transcript": "If the goal is to build more ships. Well, we have to have a good workforce. That's first and foremost. So our electricians are pipe bidders, welders. Those are high demand jobs. That's Shelly Thigpen. She's overseeing the build they're starting on today, a Coast Guard cutter due in three years. But to hit that deadline, the shipyard needs 365 people. Finding enough people is one of the biggest ongoing challenges for the business. Austin USA can't just hire anyone who wants this job. For security reasons, the government only lets it hire US green card holders and citizens. I mean, US citizens can be spies too, right? We follow the requirements of our contracts to make sure that we're doing the necessary background checks. Then Austin USA has to spend four years training them as part of its apprenticeship program. This has to be very precise, but this is basically spot on. From the design to this cutting table, everything is right on them. What if it was like one millimeter off? It could be a big problem. I went down the line, it could throw bulkheads off, it could throw frames off. The rework that would cause would be many, many hours. That's why every job here takes skill and precision. I mean, if I'm off by any amount, it might leave too big of a gap that's going on too. To train just 200 apprentices, Austin USA has to spend over $3 million. And once you've invested that much, the next big challenge becomes getting them to stay in the business. And you understand why that's hard when you see workers layering up in 100 degree Alabama heat. Are you putting that sweater on? Yeah. It's so hot. Why? I'll keep the fire heating up and I'll keep burning it up. It's a hot job. It's a hot job as we've done. We are lucky to have everything under cover to where we're not in the sun, so that's better. At many American shipyards, most of this work happens outside, which makes hot days even hotter. But when it rains, sometimes work stops. Employees get paid hourly, so when the weather is bad, they're likely looking at a smaller paycheck. That's another reason there's so much turnover in this industry. Why not salary people? An hourly worker, they can get paid overtime. It's just how it's set up, really.", "brk": "", "my": "", "tags": "coastguard, shipbuilders, america, madeinamerica", "bait": false, "type": "Video", "likes": 3878, "comments": 139, "er": 0.08, "followers": 5057570, "date": "2026-10-30", "url": "https://www.instagram.com/p/DfHyqqdFCzy/", "video": true, "ratio": 0, "score": 0.08, "status": "未处理", "x": 0.8}, {"id": "DfILUanD5mb", "tracker": "viral-radar 竞对", "competitor": "businessinsider", "caption": "The World Cup is a massive global event. This summer, the tournament brought in nearly 6 billion spectators. So why is McDonald's walking away from its partnership with FIFA?\n\nThe fast food company has been advertising with the soccer giant for 32 years, and that deal is worth an estimated $40 million per year. But even with the extensive reach of the World Cup, McDonald's determined that the exposure fro       el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 Instagram 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
